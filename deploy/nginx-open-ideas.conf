# Nginx: фронтенд на порту 80 → Next.js :3000
# API остаётся на :8000 (без изменений)
#
# Установка на Ubuntu:
#   sudo cp deploy/nginx-open-ideas.conf /etc/nginx/sites-available/open-ideas
#   sudo ln -sf /etc/nginx/sites-available/open-ideas /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name 5.181.252.246;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
